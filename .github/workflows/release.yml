# Builds signed APKs from the tagged source and publishes them as a GitHub release.
# Trigger: push a tag like v0.1.0.
# Secrets: SIGNING_KEYSTORE_BASE64 (base64 of the .jks), SIGNING_STORE_PASSWORD,
#          SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).

      - name: Fetch sherpa-onnx and model
        run: ./scripts/fetch-deps.sh

      - name: Write signing config
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "LOCAL_VOICE_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APKs
        run: |
          mkdir dist
          # local-voice-<abi>.apk = Local Voice Setup (installs the app so its accessibility
          # service can be turned on); local-voice-app-<abi>.apk = the bare app, for adb.
          for flavor in armeabiV7a:armeabi-v7a arm64V8a:arm64-v8a; do
            abi="${flavor#*:}"
            cp "installer/build/outputs/apk/${flavor%%:*}/release/installer-${flavor%%:*}-release.apk" "dist/local-voice-$abi.apk"
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/local-voice-app-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Local Voice $GITHUB_REF_NAME" \
            --notes "Install local-voice-<abi>.apk (Local Voice Setup) on the TV, open it and press Install: armeabi-v7a for 32-bit boxes (e.g. onn 4K), arm64-v8a for 64-bit (e.g. NVIDIA Shield). local-voice-app-<abi>.apk is the bare app for adb installs. See the README. SHA256SUMS.txt lists checksums."
